<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Hub | Loader</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0a1120;
            color: #f0f6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(20, 115, 255, 0.6), 0 0 20px rgba(20, 115, 255, 0.4);
        }

        /* Entry Screen Gateway */
        #entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a1120;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .gateway-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #f0f6ff;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .gateway-title span {
            color: #1473ff;
        }

        .enter-btn {
            background: transparent;
            color: #1473ff;
            border: 2px solid #1473ff;
            padding: 14px 45px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(20, 115, 255, 0.2);
            transition: all 0.3s ease;
        }

        .enter-btn:hover {
            background-color: #1473ff;
            color: #f0f6ff;
            box-shadow: 0 0 25px rgba(20, 115, 255, 0.6);
            transform: scale(1.03);
        }

        /* Interface Dashboard Window */
        #main-content {
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.5s ease 0.1s, transform 0.5s ease 0.1s;
            width: 90%;
            max-width: 580px;
            background-color: #111d32;
            border: 1.5px solid #1473ff;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .hub-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .brand-logo {
            background-color: #1473ff;
            color: #f0f6ff;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            font-weight: 900;
            border-radius: 10px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #87afeb;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .section-label {
            text-align: left;
            font-size: 0.85rem;
            font-weight: 700;
            color: #87afeb;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* Elements Containers */
        .box-container {
            background-color: #0a1120;
            border: 1px solid #1a2d4a;
            border-radius: 8px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #00ffcc;
            white-space: nowrap;
            overflow-x: auto;
            text-align: left;
            width: 100%;
        }

        code::-webkit-scrollbar { height: 4px; }
        code::-webkit-scrollbar-thumb { background: #111d32; }

        .action-btn {
            background: none;
            border: none;
            color: #8f9cae;
            font-size: 1.25rem;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 10px;
            transition: color 0.2s;
        }

        .action-btn:hover { color: #1473ff; }

        .gen-panel-wrapper {
            display: flex;
            gap: 10px;
        }
        
        .gen-display {
            flex-grow: 1;
            margin-bottom: 0;
        }

        .gen-trigger-btn {
            background-color: #1473ff;
            color: #f0f6ff;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .gen-trigger-btn:hover {
            background-color: #0056cc;
        }

        /* Toast Popup Alert */
        .toast-alert {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #1473ff;
            color: #f0f6ff;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            z-index: 100;
        }

        .toast-alert.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="entry-screen">
        <div class="gateway-title neon-glow">Blue <span>Hub</span></div>
        <button class="enter-btn" onclick="initializeEntry()">Click to enter...</button>
    </div>

    <div id="main-content">
        <div class="hub-header">
            <div class="brand-logo">B</div>
            <h1 class="neon-glow">Blue Hub</h1>
        </div>
        <div class="subtitle">Brookhaven Edition</div>
        
        <!-- Script Section -->
        <div class="section-label">Executor Script</div>
        <div class="box-container">
            <code id="loadstring-payload">loadstring(game:HttpGet("https://raw.githubusercontent.com/tlzblue/blue-hub/refs/heads/main/main.lua"))()</code>
            <button class="action-btn" onclick="copyText('loadstring-payload', 'Script copied!')"><i class="fa-regular fa-copy"></i></button>
        </div>

        <!-- Key Generation Section -->
        <div class="section-label">Access Key Generator</div>
        <div class="gen-panel-wrapper">
            <div class="box-container gen-display">
                <code id="key-display">Click Gen Key...</code>
                <button class="action-btn" onclick="copyText('key-display', 'Key copied!')"><i class="fa-regular fa-copy"></i></button>
            </div>
            <button class="gen-trigger-btn" onclick="generateSecureHubKey()">Gen Key</button>
        </div>
    </div>

    <div id="alert-toast" class="toast-alert">Copied to clipboard!</div>

    <script>
        function initializeEntry() {
            document.getElementById('entry-screen').style.opacity = '0';
            document.getElementById('entry-screen').style.visibility = 'hidden';
            
            const mainContent = document.getElementById('main-content');
            mainContent.style.opacity = '1';
            mainContent.style.transform = 'scale(1)';
            
            copyText('loadstring-payload', 'Script copied automatically!');
        }

        // Key System Generator Logic
        function generateSecureHubKey() {
            const characters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let randomSequence = '';
            
            // Generate a random 8-character code string suffix
            for (let i = 0; i < 8; i++) {
                randomSequence += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            
            // Build the validated key structural requirement string
            const generatedKey = `Blue-${randomSequence}`;
            
            document.getElementById('key-display').innerText = generatedKey;
        }

        function copyText(elementId, alertMsg) {
            const target = document.getElementById(elementId);
            if(target.innerText.includes("Click Gen Key")) return;
            
            navigator.clipboard.writeText(target.innerText).then(() => {
                const toast = document.getElementById('alert-toast');
                toast.innerText = alertMsg;
                toast.classList.add('visible');
                setTimeout(() => toast.classList.remove('visible'), 2000);
            });
        }
    </script>
</body>
</html>
